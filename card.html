<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        .ytLockupViewModelHost {
            display: flex;
            flex-direction: column;
            width: 168px;
        }

        .ytLockupViewModelContentImage {
            display: block;
            width: 100%;
        }

        .ytLockupMetadataViewModelTextContainer {
            padding: 8px;
        }

        .ytLockupMetadataViewModelHeadingReset {
            font-size: 14px;
            margin: 0;
        }

        .ytLockupMetadataViewModelMetadata {
            font-size: 12px;
            color: #606060;
        }

        .ytLockupMetadataViewModelMenuButton {
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .ytSpecButtonShapeNextHost {
            background: none;
            border: none;
            cursor: pointer;
        }

        .ytSpecButtonShapeNextIcon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
.ytThumbnailViewModelImage {
    position: absolute;
    transform: translateY(-50%);
    top: 50%;
    left: 0;
    width: 100%;
    height: 100%;
}


.ytCoreImageContentModeScaleAspectFill {
    object-fit: cover;
}
.ytCoreImageFillParentWidth {
    width: 100%;
}
.ytCoreImageFillParentHeight {
    height: 100%;
}
.ytCoreImageLoaded {
    visibility: inherit;
}
.ytCoreImageHost {
    visibility: hidden;
    display: inline-block;
    min-height: 1px;
    min-width: 1px;
}
*/

    </style>
</head>

<body>
    <yt-lockup-view-model class="ytd-item-section-renderer lockup ytLockupViewModelWrapper">
        <div class="ytLockupViewModelHost ytLockupViewModelHorizontal content-id-jXU3DNg5Ppg ytLockupViewModelCompact ytLockupViewModelFlexNone">
            <yt-touch-feedback-shape aria-hidden="true"
                class="ytSpecTouchFeedbackShapeHost ytSpecTouchFeedbackShapeTouchResponse ytSpecTouchFeedbackShapeThumbnailSizeMedium ytSpecTouchFeedbackShapeTriggerEvents"
                style="margin: -6px;">
                <div class="ytSpecTouchFeedbackShapeStroke"></div>
                <div class="ytSpecTouchFeedbackShapeFill"></div>

            </yt-touch-feedback-shape>

            <!-- Thumbnail  kostas P.-->
            <a href="https://www.youtube.com/watch?v=jXU3DNg5Ppg" rel="nofollow"
                        class="ytLockupViewModelContentImage" aria-haspopup="false" tabindex="-1" aria-hidden="true"
                        style="width: 168px;">
                        <yt-thumbnail-view-model
                            class="ytThumbnailViewModelHost ytThumbnailViewModelAspectRatio16By9 ytThumbnailViewModelMedium">

                            <div class="ytThumbnailViewModelImage">
                            <img alt=""
                                class="ytCoreImageHost ytCoreImageFillParentHeight ytCoreImageFillParentWidth ytCoreImageContentModeScaleAspectFill ytCoreImageLoaded"
                                src="https://i.ytimg.com/vi/jXU3DNg5Ppg/hqdefault.jpg?sqp=-oaymwEmCKgBEF5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&amp;rs=AOn4CLA28HlrL_U1nMrkya08CHyIWYBa4g">
                            </div>
                            
                            <yt-thumbnail-bottom-overlay-view-model class="ytThumbnailBottomOverlayViewModelHost">
                                <div class="ytThumbnailBottomOverlayViewModelBadgeContainer ytThumbnailBottomOverlayViewModelBadgeContainerMedium">
                                    <yt-thumbnail-badge-view-model
                                            class="ytThumbnailBadgeViewModelHost ytThumbnailBottomOverlayViewModelBadge">
                                        <badge-shape
                                                    class="ytBadgeShapeHost ytBadgeShapeThumbnailDefault ytBadgeShapeThumbnailBadge ytBadgeShapeTypography">
                                            <div class="ytBadgeShapeText">4:12</div>
                                        </badge-shape>
                                    </yt-thumbnail-badge-view-model>
                                </div>
                            </yt-thumbnail-bottom-overlay-view-model>
                        </yt-thumbnail-view-model>
            </a>

            <div class="ytLockupViewModelMetadata">
                <yt-lockup-metadata-view-model class="ytLockupMetadataViewModelHost ytLockupMetadataViewModelHorizontal ytLockupMetadataViewModelCompact">
                    <div class="ytLockupMetadataViewModelAvatar">
                        <yt-decorated-avatar-view-model class="ytDecoratedAvatarViewModelHost">
                            <yt-avatar-shape>
                                <div class="ytSpecAvatarShapeHost ytSpecAvatarShapeButton ytSpecAvatarShapeButtonMedium ytSpecAvatarShapeTappable"
                                    aria-label="Μετάβαση στο κανάλι Applied AI Course" role="button" tabindex="0">
                                    <div class="">
                                        <div class="ytSpecAvatarShapeAvatarSizeMedium"><img alt=""
                                                class="ytCoreImageHost ytSpecAvatarShapeImage ytCoreImageFillParentHeight ytCoreImageFillParentWidth ytCoreImageContentModeScaleToFill">
                                            <div class="ytSpecAvatarShapeImageOverlays ytSpecAvatarShapeImage"></div>
                                        </div>
                                    </div>
                                </div>
                            </yt-avatar-shape>
                        </yt-decorated-avatar-view-model>
                    </div>

                    <div class="ytLockupMetadataViewModelTextContainer">
                        <h3 class="ytLockupMetadataViewModelHeadingReset"
                            title="Row Vector, Column Vector: Dimensionality reduction and visualization Lecture 2 @Applied AI Course"
                            aria-label="Row Vector, Column Vector: Dimensionality reduction and visualization Lecture 2 @Applied AI Course">
                            <a href="https://www.youtube.com/watch?v=jXU3DNg5Ppg" rel="nofollow" class="ytLockupMetadataViewModelTitle"
                                aria-haspopup="false"
                                aria-label="Row Vector, Column Vector: Dimensionality reduction and visualization Lecture 2 @Applied AI Course 4 λεπτά, 12 δευτερόλεπτα" style="">
                                <span class="ytAttributedStringHost ytAttributedStringWhiteSpacePreWrap"
                                    dir="auto" role="text" style="">Row Vector, Column Vector: Dimensionality reduction
                                    and visualization Lecture 2 @Applied AI Course</span>
                            </a>
                        </h3>

                        <div class="ytLockupMetadataViewModelMetadata">
                            <yt-content-metadata-view-model class="ytContentMetadataViewModelHost">
                                <div role="group" class="ytContentMetadataViewModelMetadataRow"><span
                                        class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytAttributedStringWhiteSpacePreWrap ytAttributedStringLinkInheritColor"
                                        dir="auto" role="text">Applied AI Course</span></div>
                                <div role="group" class="ytContentMetadataViewModelMetadataRow"><span
                                        class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytAttributedStringWhiteSpacePreWrap ytAttributedStringLinkInheritColor"
                                        dir="auto" role="text">14&nbsp;χιλ. προβολές</span><span aria-hidden="true"
                                        class="ytContentMetadataViewModelDelimiter"> • </span><span
                                        class="ytAttributedStringHost ytContentMetadataViewModelMetadataText ytAttributedStringWhiteSpacePreWrap ytAttributedStringLinkInheritColor"
                                        dir="auto" aria-label="πριν από 8 έτη" role="text">πριν από 8 έτη</span></div>
                            </yt-content-metadata-view-model>
                        </div>

                    </div>

                    <div class="ytLockupMetadataViewModelMenuButton"><button-view-model
                            class="ytSpecButtonViewModelHost"><button
                                class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextText ytSpecButtonShapeNextMono ytSpecButtonShapeNextSizeM ytSpecButtonShapeNextIconButton ytSpecButtonShapeNextEnableBackdropFilterExperiment"
                                title="" aria-label="Περισσότερες ενέργειες" aria-disabled="false" style="">
                                <div aria-hidden="true" class="ytSpecButtonShapeNextIcon"><span
                                        class="ytIconWrapperHost" style="width: 24px; height: 24px;"><span
                                            class="yt-icon-shape ytSpecIconShapeHost">
                                            <div style="width: 100%; height: 100%; display: block; fill: currentcolor;">
                                                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24"
                                                    width="24" focusable="false" aria-hidden="true"
                                                    style="pointer-events: none; display: inherit; width: 100%; height: 100%;">
                                                    <path
                                                        d="M12 4a2 2 0 100 4 2 2 0 000-4Zm0 6a2 2 0 100 4 2 2 0 000-4Zm0 6a2 2 0 100 4 2 2 0 000-4Z">
                                                    </path>
                                                </svg></div>
                                        </span></span></div><yt-touch-feedback-shape aria-hidden="true"
                                    class="ytSpecTouchFeedbackShapeHost ytSpecTouchFeedbackShapeTouchResponse">
                                    <div class="ytSpecTouchFeedbackShapeStroke"></div>
                                    <div class="ytSpecTouchFeedbackShapeFill"></div>
                                </yt-touch-feedback-shape>
                            </button></button-view-model>
                    </div>
                </yt-lockup-metadata-view-model>
            </div>
        </div>
    </yt-lockup-view-model>

</body>
</html>
